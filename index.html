<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Chat</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0e1217;
            --bg-sidebar: #171c23;
            --bg-card: #1c232d;
            --bg-input: #1e2631;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2e3744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* سایدبار */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 10;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            transition: 0.2s;
        }
        .new-chat-btn:hover { background-color: var(--border); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item:hover, .history-item.active { background-color: var(--bg-card); color: var(--text-main); }

        /* بخش اصلی */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background-color: var(--bg-main);
        }

        /* هدر */
        .chat-header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .persona-select {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.85rem;
        }

        /* صفحه شروع (Welcoming / Home Screen) */
        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 20px;
            text-align: center;
        }

        .home-title {
            font-size: 2.2rem;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: -0.5px;
        }

        /* باکس چت */
        .chat-box {
            flex: 1;
            padding: 20px 15%;
            overflow-y: auto;
            display: none; /* در حالت اولیه مخفی است */
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.7;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background-color: transparent;
            color: var(--text-main);
            padding-right: 0;
        }

        /* اینپوت کانتینر اصلی */
        .input-wrapper {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
        }

        .input-box {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: var(--accent); }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            resize: none;
            height: 24px;
            max-height: 150px;
            font-size: 0.95rem;
            padding: 2px 0;
        }

        .icon-btn {
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.05); }
        .send-btn { color: var(--accent); }

        /* پیش‌نمایش فایل */
        .file-preview {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            width: fit-content;
        }
        .file-preview img { width: 35px; height: 35px; border-radius: 6px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- سایدبار -->
    <div class="sidebar">
        <div class="brand-title">
            <i class="fa-solid fa-sparkles"></i> Visual Chat
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> چت جدید
        </button>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- بخش اصلی چت -->
    <div class="main-content">
        <div class="chat-header">
            <div>
                <select class="persona-select" id="personaSelect">
                    <option value="default">حالت استاندارد</option>
                    <option value="friendly">صمیمی و دوستانه</option>
                    <option value="coder">برنامه‌نویس و کدنویسی</option>
                    <option value="formal">رسمی</option>
                </select>
            </div>
        </div>

        <!-- صفحه اول / چت جدید (Gemini Style) -->
        <div class="home-screen" id="homeScreen">
            <h1 class="home-title">از کجا شروع کنیم؟</h1>
        </div>

        <!-- باکس نمایش پیام‌ها -->
        <div class="chat-box" id="chatBox"></div>

        <!-- ورودی پیام -->
        <div class="input-wrapper">
            <div class="file-preview" id="filePreview">
                <img id="previewImg" src="" alt="preview">
                <span id="fileName" style="font-size: 0.85rem; color: var(--text-muted);"></span>
                <i class="fa-solid fa-xmark icon-btn" onclick="removeFile()"></i>
            </div>

            <div class="input-box">
                <input type="file" id="fileInput" hidden onchange="handleFileSelect(event)">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="افزودن فایل/تصویر">
                    <i class="fa-solid fa-plus"></i>
                </button>
                
                <textarea id="userInput" placeholder="پرسیدن از Visual Chat..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                
                <button class="icon-btn send-btn" onclick="sendMessage()" title="ارسال">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    let currentChatId = Date.now();
    let chats = JSON.parse(localStorage.getItem('visual_chat_history')) || {};
    let selectedFileData = null;
    let isFirstMessage = true;

    window.onload = () => {
        renderHistory();
    };

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            selectedFileData = {
                name: file.name,
                type: file.type,
                base64: e.target.result
            };
            document.getElementById('fileName').innerText = file.name;
            if(file.type.startsWith('image/')) {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewImg').style.display = 'block';
            } else {
                document.getElementById('previewImg').style.display = 'none';
            }
            document.getElementById('filePreview').style.display = 'flex';
        };
        reader.readAsDataURL(file);
    }

    function removeFile() {
        selectedFileData = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('filePreview').style.display = 'none';
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const homeScreen = document.getElementById("homeScreen");
        const text = inputField.value.trim();
        const persona = document.getElementById("personaSelect").value;

        if (!text && !selectedFileData) return;

        // سوئیچ از صفحه هوم به حالت چت
        if (isFirstMessage) {
            homeScreen.style.display = 'none';
            chatBox.style.display = 'flex';
            isFirstMessage = false;
        }

        // ساخت پیام کاربر
        let userContentHtml = text;
        if (selectedFileData && selectedFileData.type.startsWith('image/')) {
            userContentHtml += `<br><img src="${selectedFileData.base64}" style="max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 8px;">`;
        }

        appendMessage('user', userContentHtml);
        inputField.value = "";
        
        const currentPayloadFile = selectedFileData;
        removeFile();

        // لودینگ پاسخ
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = "در حال تفکر...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    text: text, 
                    persona: persona,
                    file: currentPayloadFile 
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                const reply = data.candidates[0].content.parts[0].text;
                loadingDiv.innerHTML = formatReply(reply);
            } else if (data.reply) { // اگر از API سفارشی استفاده می‌کنی
                loadingDiv.innerHTML = formatReply(data.reply);
            } else if (data.error) {
                loadingDiv.innerText = "⚠️ خطا: " + (data.error.message || "مشکلی پیش آمد.");
            } else {
                loadingDiv.innerText = "خطا در دریافت پاسخ از هوش مصنوعی!";
            }
        } catch (error) {
            loadingDiv.innerText = "خطا در ارتباط با سرور!";
        }

        chatBox.scrollTop = chatBox.scrollHeight;
        saveCurrentChat();
    }

    function appendMessage(sender, content) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = content;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function formatReply(text) {
        let formatted = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#171c23; padding:12px; border-radius:8px; overflow-x:auto; margin-top:8px;"><code>$1</code></pre>');
        return formatted.replace(/\n/g, '<br>');
    }

    function startNewChat() {
        currentChatId = Date.now();
        isFirstMessage = true;
        document.getElementById("chatBox").innerHTML = "";
        document.getElementById("chatBox").style.display = 'none';
        document.getElementById("homeScreen").style.display = 'flex';
        renderHistory();
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById("chatBox");
        const firstUserMsg = chatBox.querySelector('.message.user')?.innerText || "گفتگوی جدید";
        chats[currentChatId] = {
            title: firstUserMsg.substring(0, 25) + "...",
            html: chatBox.innerHTML
        };
        localStorage.setItem('visual_chat_history', JSON.stringify(chats));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        Object.keys(chats).reverse().forEach(id => {
            const item = document.createElement("div");
            item.className = `history-item ${id == currentChatId ? 'active' : ''}`;
            item.innerHTML = `<i class="fa-regular fa-message"></i> <span>${chats[id].title}</span>`;
            item.onclick = () => loadChat(id);
            list.appendChild(item);
        });
    }

    function loadChat(id) {
        currentChatId = id;
        isFirstMessage = false;
        document.getElementById("homeScreen").style.display = 'none';
        document.getElementById("chatBox").style.display = 'flex';
        document.getElementById("chatBox").innerHTML = chats[id].html;
        renderHistory();
    }
</script>
</body>
</html>
