<script>
    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const text = inputField.value.trim();

        if (!text) return;

        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = "در حال پاسخگویی...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                const reply = data.candidates[0].content.parts[0].text;
                loadingDiv.innerText = reply;
            } else if (data.error) {
                // نمایش مستقیم ارور اصلی گوگل یا سرور
                loadingDiv.innerText = "⚠️ خطا: " + (data.error.message || JSON.stringify(data.error));
            } else {
                loadingDiv.innerText = "خطا در دریافت پاسخ! (پاسخ معتبر دریافت نشد)";
            }
        } catch (error) {
            loadingDiv.innerText = "خطا در برقراری ارتباط با سرور!";
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
