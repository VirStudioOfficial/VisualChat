<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input</title>
    <style>
        /* 1. Reset و استایل‌های اصلی کانتینر چت */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-input-container {
            display: flex;
            align-items: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 8px 16px;
            width: 90%;
            max-width: 700px;
            gap: 12px;
        }

        /* 2. حل کامل مشکل textarea، پس‌زمینه سفید و فلش کروم */
        .chat-input {
            flex: 1;
            background: transparent !important;
            color: #ffffff !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            resize: none !important; /* حذف فلش تغییر اندازه */
            font-size: 14px;
            line-height: 1.5;
            max-height: 120px;
            height: 24px;
        }

        /* مخفی‌سازی آیکون ریسایز کروم */
        .chat-input::-webkit-resizer {
            display: none !important;
        }

        /* رفع مشکل Autofill سفید در کروم */
        .chat-input:-webkit-autofill,
        .chat-input:-webkit-autofill:hover,
        .chat-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #1e293b inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }

        .chat-input::placeholder {
            color: #94a3b8 !important;
        }

        /* 3. استایل دکمه‌ها و حالت انیمیشن ضبط صدا */
        .icon-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: #38bdf8;
            background: rgba(255, 255, 255, 0.05);
        }

        /* افکت چشمک‌زن موقع ضبط صدا */
        .icon-btn.recording {
            color: #ef4444;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="chat-input-container">
        <!-- دکمه ارسال -->
        <button class="icon-btn" id="send-btn" title="ارسال">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>

        <!-- ورودی متن -->
        <textarea class="chat-input" id="chat-input" placeholder="از Virtual Bot بپرسید..." rows="1"></textarea>

        <!-- دکمه ضبط صدا -->
        <button class="icon-btn" id="mic-btn" title="ضبط صدا">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>

        <!-- دکمه تست خواندن متن با صدا -->
        <button class="icon-btn" id="speak-btn" title="تست پخش صدا">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
    </div>

    <script>
        const chatInput = document.getElementById('chat-input');
        const micBtn = document.getElementById('mic-btn');
        const speakBtn = document.getElementById('speak-btn');

        // ۱. تنظیم ارتفاع خودکار textarea با تایپ متن
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = chatInput.scrollHeight + 'px';
        });

        // ۲. منطق ضبط صدا (Voice-to-Text)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR'; // تنظیم روی زبان فارسی
            recognition.continuous = false;
            recognition.interimResults = false;

            let isRecording = false;

            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    try {
                        recognition.start();
                        micBtn.classList.add('recording');
                        isRecording = true;
                    } catch (err) {
                        console.error('خطا در شروع ضبط:', err);
                    }
                } else {
                    recognition.stop();
                    micBtn.classList.remove('recording');
                    isRecording = false;
                }
            });

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                chatInput.value += (chatInput.value ? ' ' : '') + text;
                chatInput.dispatchEvent(new Event('input')); // به‌روزرسانی ارتفاع
            };

            recognition.onerror = (e) => {
                console.error('خطای تشخیص صدا:', e.error);
                micBtn.classList.remove('recording');
                isRecording = false;
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                isRecording = false;
            };
        } else {
            micBtn.style.display = 'none';
            console.warn('مرورگر شما از قابلیت تبدیل صدا به متن پشتیبانی نمی‌کند.');
        }

        // ۳. منطق خواندن متن توسط هوش مصنوعی (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // متوقف کردن صداهای قبلی
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('مرورگر شما از پخش صدا پشتیبانی نمی‌کند.');
            }
        }

        // دکمه تست خواندن متن موجود در input
        speakBtn.addEventListener('click', () => {
            const textToSpeak = chatInput.value || "محتوایی برای خواندن وجود ندارد.";
            speakText(textToSpeak);
        });
    </script>
</body>
</html>
