<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Chat Pro</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- اسکریپت ورود با گوگل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --bg-main: #0e1217;
            --bg-sidebar: #171c23;
            --bg-card: #1c232d;
            --bg-input: #1e2631;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2e3744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        
        html, body {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        body { display: flex; position: relative; }

        /* انیمیشن‌های نرم ظهور و افکت‌ها */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(56, 189, 248, 0.2); }
            50% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
            100% { box-shadow: 0 0 5px rgba(56, 189, 248, 0.2); }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 15;
        }
        .sidebar-overlay.active { display: block; }

        /* سایدبار */
        .sidebar {
            width: 270px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        /* کارت پروفایل کاربر */
        .user-profile {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .user-info { flex: 1; overflow: hidden; }
        .user-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .new-chat-btn:hover { background-color: var(--border); transform: translateY(-1px); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }
        .history-item:hover, .history-item.active { background-color: var(--bg-card); color: var(--text-main); }

        /* بخش اصلی چت */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            position: relative;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
        }

        .persona-select {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.85rem;
        }

        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .home-title { font-size: 1.8rem; font-weight: 600; color: #e2e8f0; }

        /* پیام‌ها و انیمیشن ظهور نرم */
        .chat-box {
            flex: 1;
            padding: 20px 15%;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 0.92rem;
            animation: fadeIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background-color: transparent;
            color: var(--text-main);
            padding-right: 0;
        }

        .sticker-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            animation: fadeIn 0.3s ease;
        }

        /* ورودی و پاپ‌آپ استیکر */
        .input-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 15px 15px 15px;
            position: relative;
        }

        /* پنل انتخاب استیکر */
        .sticker-picker {
            display: none;
            position: absolute;
            bottom: 75px;
            right: 20px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 30;
            animation: fadeIn 0.2s ease;
        }
        .sticker-picker.active { display: grid; }
        .sticker-item {
            width: 55px;
            height: 55px;
            cursor: pointer;
            border-radius: 8px;
            padding: 4px;
            transition: transform 0.2s;
        }
        .sticker-item:hover { transform: scale(1.15); background-color: var(--bg-input); }

        .input-box {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: var(--accent); }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            resize: none;
            height: 24px;
            max-height: 120px;
            font-size: 0.95rem;
            padding: 2px 0;
        }

        .icon-btn {
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.08); }
        .send-btn { color: var(--accent); }

        .file-preview {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            width: fit-content;
            animation: fadeIn 0.2s;
        }
        .file-preview img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }

        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .sidebar {
                position: fixed;
                top: 0; right: 0; bottom: 0;
                transform: translateX(100%);
                box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            }
            .sidebar.open { transform: translateX(0); }
            .chat-box { padding: 15px 12px; }
            .message { max-width: 90%; }
            .home-title { font-size: 1.4rem; }
            .input-wrapper { padding: 8px 10px 10px 10px; }
            .sticker-picker { right: 10px; left: 10px; grid-template-columns: repeat(5, 1fr); }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- سایدبار -->
    <div class="sidebar" id="sidebar">
        <div class="brand-title">
            <span><i class="fa-solid fa-sparkles"></i> Visual Chat</span>
            <i class="fa-solid fa-xmark icon-btn" onclick="toggleSidebar()" style="display: var(--mobile-close, none);"></i>
        </div>

        <!-- کارت حساب گوگل -->
        <div class="user-profile" id="userProfile">
            <div id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="small" data-theme="dark"></div>
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> چت جدید
        </button>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- بخش اصلی -->
    <div class="main-content">
        <div class="chat-header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()" title="منو">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <select class="persona-select" id="personaSelect">
                    <option value="default">حالت استاندارد</option>
                    <option value="friendly">صمیمی و دوستانه</option>
                    <option value="coder">برنامه‌نویس و کدنویسی</option>
                    <option value="formal">رسمی</option>
                </select>
            </div>
        </div>

        <div class="home-screen" id="homeScreen">
            <h1 class="home-title">از کجا شروع کنیم؟</h1>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-wrapper">
            <!-- پنل استیکرها -->
            <div class="sticker-picker" id="stickerPicker">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f600/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60e/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f917/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f914/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f525/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f389/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
            </div>

            <div class="file-preview" id="filePreview">
                <img id="previewImg" src="" alt="preview">
                <span id="fileName" style="font-size: 0.8rem; color: var(--text-muted);"></span>
                <i class="fa-solid fa-xmark icon-btn" onclick="removeFile()" style="width:24px; height:24px; font-size:0.9rem;"></i>
            </div>

            <div class="input-box">
                <input type="file" id="fileInput" hidden onchange="handleFileSelect(event)">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="افزودن فایل">
                    <i class="fa-solid fa-plus"></i>
                </button>
                
                <button class="icon-btn" onclick="toggleStickerPicker()" title="استیکر">
                    <i class="fa-regular fa-face-smile"></i>
                </button>

                <textarea id="userInput" placeholder="پرسیدن از Visual Chat..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                
                <button class="icon-btn send-btn" onclick="sendMessage()" title="ارسال">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    let currentChatId = Date.now();
    let currentUser = null;
    let chats = JSON.parse(localStorage.getItem('visual_chat_history')) || {};
    let selectedFileData = null;
    let isFirstMessage = true;

    window.onload = () => {
        renderHistory();
        checkSavedUser();
        if (window.innerWidth <= 768) {
            document.documentElement.style.setProperty('--mobile-close', 'block');
        }
    };

    // پردازش پاسخ ورود گوگل
    function handleCredentialResponse(response) {
        const responsePayload = parseJwt(response.credential);
        currentUser = {
            name: responsePayload.name,
            email: responsePayload.email,
            picture: responsePayload.picture
        };
        localStorage.setItem('visual_chat_user', JSON.stringify(currentUser));
        updateUserUI();
    }

    function parseJwt(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    function checkSavedUser() {
        const saved = localStorage.getItem('visual_chat_user');
        if (saved) {
            currentUser = JSON.parse(saved);
            updateUserUI();
        }
    }

    function updateUserUI() {
        if (!currentUser) return;
        const profileDiv = document.getElementById('userProfile');
        profileDiv.innerHTML = `
            <img src="${currentUser.picture}" class="user-avatar" alt="User">
            <div class="user-info">
                <div class="user-name">${currentUser.name}</div>
                <div class="user-email">${currentUser.email}</div>
            </div>
        `;
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function toggleStickerPicker() {
        document.getElementById('stickerPicker').classList.toggle('active');
    }

    function sendSticker(stickerUrl) {
        toggleStickerPicker();
        const stickerHtml = `<img src="${stickerUrl}" class="sticker-img" alt="sticker">`;
        appendMessage('user', stickerHtml);
        
        if (isFirstMessage) {
            document.getElementById("homeScreen").style.display = 'none';
            document.getElementById("chatBox").style.display = 'flex';
            isFirstMessage = false;
        }

        // ارسال لایک / استیکر به هوش مصنوعی برای پاسخ
        sendToGemini("کاربر یک استیکر فرستاد!");
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function compressImage(file, maxDimension = 1024, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxDimension) { height = Math.round((height * maxDimension) / width); width = maxDimension; }
                    } else {
                        if (height > maxDimension) { width = Math.round((width * maxDimension) / height); height = maxDimension; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            };
        });
    }

    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileNameSpan = document.getElementById('fileName');
        const previewImg = document.getElementById('previewImg');
        document.getElementById('filePreview').style.display = 'flex';
        fileNameSpan.innerText = "در حال فشرده‌سازی...";

        try {
            if (file.type.startsWith('image/')) {
                const compressedBase64 = await compressImage(file, 1024, 0.7);
                selectedFileData = { name: file.name, type: 'image/jpeg', base64: compressedBase64 };
                previewImg.src = compressedBase64;
                previewImg.style.display = 'block';
                fileNameSpan.innerText = `${file.name} (بهینه‌شده)`;
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedFileData = { name: file.name, type: file.type, base64: e.target.result };
                    previewImg.style.display = 'none';
                    fileNameSpan.innerText = file.name;
                };
                reader.readAsDataURL(file);
            }
        } catch (e) { fileNameSpan.innerText = "خطا در پردازش فایل"; }
    }

    function removeFile() {
        selectedFileData = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('filePreview').style.display = 'none';
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const text = inputField.value.trim();
        if (!text && !selectedFileData) return;

        if (isFirstMessage) {
            document.getElementById("homeScreen").style.display = 'none';
            document.getElementById("chatBox").style.display = 'flex';
            isFirstMessage = false;
        }

        let userContentHtml = text;
        if (selectedFileData && selectedFileData.type.startsWith('image/')) {
            userContentHtml += `<br><img src="${selectedFileData.base64}" style="max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px;">`;
        }

        appendMessage('user', userContentHtml);
        inputField.value = "";
        
        const payloadFile = selectedFileData;
        removeFile();

        sendToGemini(text, payloadFile);
    }

    async function sendToGemini(textPrompt, payloadFile = null) {
        const sendBtn = document.querySelector(".send-btn");
        const chatBox = document.getElementById("chatBox");
        const persona = document.getElementById("personaSelect").value;

        sendBtn.disabled = true;
        sendBtn.style.opacity = "0.5";

        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = "در حال تفکر...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: textPrompt, persona: persona, file: payloadFile })
            });

            const data = await response.json();
            
            if (response.status === 429) {
                loadingDiv.innerHTML = "⏳ **محدودیت تعداد درخواست!** لطفا حدود ۴۵ ثانیه صبر کنید.";
            } else if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                const reply = data.candidates[0].content.parts[0].text;
                typeWriterEffect(loadingDiv, reply);
            } else {
                loadingDiv.innerText = "⚠️ خطا در دریافت پاسخ!";
            }
        } catch (error) {
            loadingDiv.innerText = "خطا در ارتباط با سرور!";
        } finally {
            sendBtn.disabled = false;
            sendBtn.style.opacity = "1";
        }

        saveCurrentChat();
    }

    // انیمیشن نرم تایپ پاسخ‌ها (Typewriter Animation)
    function typeWriterEffect(element, text) {
        element.innerHTML = "";
        let i = 0;
        const formattedText = formatReply(text);
        element.innerHTML = formattedText;
    }

    function appendMessage(sender, content) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = content;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function formatReply(text) {
        let formatted = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#171c23; padding:10px; border-radius:8px; overflow-x:auto; margin-top:6px;"><code>$1</code></pre>');
        return formatted.replace(/\n/g, '<br>');
    }

    function startNewChat() {
        currentChatId = Date.now();
        isFirstMessage = true;
        document.getElementById("chatBox").innerHTML = "";
        document.getElementById("chatBox").style.display = 'none';
        document.getElementById("homeScreen").style.display = 'flex';
        renderHistory();
        if (window.innerWidth <= 768) toggleSidebar();
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById("chatBox");
        const firstUserMsg = chatBox.querySelector('.message.user')?.innerText || "گفتگوی جدید";
        
        // کلید ذخیره چت اختصاصی برای اکانت گوگل (در صورت ورود)
        const storageKey = currentUser ? `visual_chat_${currentUser.email}` : 'visual_chat_history';
        
        chats[currentChatId] = {
            title: firstUserMsg.substring(0, 20) + "...",
            html: chatBox.innerHTML
        };
        localStorage.setItem(storageKey, JSON.stringify(chats));
        renderHistory();
    }

    function renderHistory() {
        const storageKey = currentUser ? `visual_chat_${currentUser.email}` : 'visual_chat_history';
        chats = JSON.parse(localStorage.getItem(storageKey)) || {};

        const list = document.getElementById("historyList");
        list.innerHTML = "";
        Object.keys(chats).reverse().forEach(id => {
            const item = document.createElement("div");
            item.className = `history-item ${id == currentChatId ? 'active' : ''}`;
            item.innerHTML = `<i class="fa-regular fa-message"></i> <span>${chats[id].title}</span>`;
            item.onclick = () => loadChat(id);
            list.appendChild(item);
        });
    }

    function loadChat(id) {
        currentChatId = id;
        isFirstMessage = false;
        document.getElementById("homeScreen").style.display = 'none';
        document.getElementById("chatBox").style.display = 'flex';
        document.getElementById("chatBox").innerHTML = chats[id].html;
        renderHistory();
        if (window.innerWidth <= 768) toggleSidebar();
    }
</script>
</body>
</html>
