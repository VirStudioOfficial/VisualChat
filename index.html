<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Chat</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0e1217;
            --bg-sidebar: #171c23;
            --bg-card: #1c232d;
            --bg-input: #1e2631;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2e3744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        
        /* حل باگ ارتفاع در تبلت و موبایل با dynamic viewport height */
        html, body {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        body { display: flex; position: relative; }

        /* لایه تاریک پشت سایدبار در موبایل/تبلت */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 15;
        }
        .sidebar-overlay.active { display: block; }

        /* سایدبار ریسپانسیو */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
            transition: 0.2s;
        }
        .new-chat-btn:hover { background-color: var(--border); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item:hover, .history-item.active { background-color: var(--bg-card); color: var(--text-main); }

        /* بخش اصلی */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            position: relative;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        /* هدر */
        .chat-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
        }

        .persona-select {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.85rem;
        }

        /* صفحه شروع */
        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }

        .home-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* باکس پیام‌ها */
        .chat-box {
            flex: 1;
            padding: 20px 15%;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 0.92rem;
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background-color: transparent;
            color: var(--text-main);
            padding-right: 0;
        }

        /* بخش ورودی */
        .input-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 15px 15px 15px;
        }

        .input-box {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            resize: none;
            height: 24px;
            max-height: 120px;
            font-size: 0.95rem;
            padding: 2px 0;
        }

        .icon-btn {
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.05); }
        .send-btn { color: var(--accent); }

        .file-preview {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            width: fit-content;
        }
        .file-preview img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }

        /* Media Queries برای تبلت و موبایل (اصلاح کامل باگ GUI) */
        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .sidebar {
                position: fixed;
                top: 0; right: 0; bottom: 0;
                transform: translateX(100%);
                box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            }
            .sidebar.open { transform: translateX(0); }
            .chat-box { padding: 15px 12px; }
            .message { max-width: 90%; }
            .home-title { font-size: 1.4rem; }
            .input-wrapper { padding: 8px 10px 10px 10px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- سایدبار -->
    <div class="sidebar" id="sidebar">
        <div class="brand-title">
            <span><i class="fa-solid fa-sparkles"></i> Visual Chat</span>
            <i class="fa-solid fa-xmark icon-btn" onclick="toggleSidebar()" style="display: var(--mobile-close, none);"></i>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> چت جدید
        </button>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- بخش اصلی -->
    <div class="main-content">
        <div class="chat-header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()" title="منو">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <select class="persona-select" id="personaSelect">
                    <option value="default">حالت استاندارد</option>
                    <option value="friendly">صمیمی و دوستانه</option>
                    <option value="coder">برنامه‌نویس و کدنویسی</option>
                    <option value="formal">رسمی</option>
                </select>
            </div>
        </div>

        <div class="home-screen" id="homeScreen">
            <h1 class="home-title">از کجا شروع کنیم؟</h1>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-wrapper">
            <div class="file-preview" id="filePreview">
                <img id="previewImg" src="" alt="preview">
                <span id="fileName" style="font-size: 0.8rem; color: var(--text-muted);"></span>
                <i class="fa-solid fa-xmark icon-btn" onclick="removeFile()" style="width:24px; height:24px; font-size:0.9rem;"></i>
            </div>

            <div class="input-box">
                <input type="file" id="fileInput" hidden onchange="handleFileSelect(event)">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="افزودن تصویر/فایل">
                    <i class="fa-solid fa-plus"></i>
                </button>
                
                <textarea id="userInput" placeholder="پرسیدن از Visual Chat..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                
                <button class="icon-btn send-btn" onclick="sendMessage()" title="ارسال">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    let currentChatId = Date.now();
    let chats = JSON.parse(localStorage.getItem('visual_chat_history')) || {};
    let selectedFileData = null;
    let isFirstMessage = true;

    window.onload = () => {
        renderHistory();
        if (window.innerWidth <= 768) {
            document.documentElement.style.setProperty('--mobile-close', 'block');
        }
    };

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // کمپرسور هوشمند عکس قبل از ارسال
    function compressImage(file, maxDimension = 1024, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDimension) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        }
                    } else {
                        if (height > maxDimension) {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    resolve(compressedBase64);
                };
                img.onerror = (err) => reject(err);
            };
            reader.onerror = (err) => reject(err);
        });
    }

    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileNameSpan = document.getElementById('fileName');
        const previewImg = document.getElementById('previewImg');
        const filePreview = document.getElementById('filePreview');

        fileNameSpan.innerText = "در حال فشرده‌سازی...";
        filePreview.style.display = 'flex';

        try {
            if (file.type.startsWith('image/')) {
                const compressedBase64 = await compressImage(file, 1024, 0.7);
                selectedFileData = {
                    name: file.name,
                    type: 'image/jpeg',
                    base64: compressedBase64
                };
                previewImg.src = compressedBase64;
                previewImg.style.display = 'block';
                fileNameSpan.innerText = `${file.name} (بهینه‌شده)`;
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedFileData = {
                        name: file.name,
                        type: file.type,
                        base64: e.target.result
                    };
                    previewImg.style.display = 'none';
                    fileNameSpan.innerText = file.name;
                };
                reader.readAsDataURL(file);
            }
        } catch (e) {
            fileNameSpan.innerText = "خطا در پردازش فایل";
        }
    }

    function removeFile() {
        selectedFileData = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('filePreview').style.display = 'none';
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const homeScreen = document.getElementById("homeScreen");
        const text = inputField.value.trim();
        const persona = document.getElementById("personaSelect").value;

        if (!text && !selectedFileData) return;

        if (isFirstMessage) {
            homeScreen.style.display = 'none';
            chatBox.style.display = 'flex';
            isFirstMessage = false;
        }

        let userContentHtml = text;
        if (selectedFileData && selectedFileData.type.startsWith('image/')) {
            userContentHtml += `<br><img src="${selectedFileData.base64}" style="max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px;">`;
        }

        appendMessage('user', userContentHtml);
        inputField.value = "";
        
        const currentPayloadFile = selectedFileData;
        removeFile();

        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = "در حال تفکر...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    text: text, 
                    persona: persona,
                    file: currentPayloadFile 
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                const reply = data.candidates[0].content.parts[0].text;
                loadingDiv.innerHTML = formatReply(reply);
            } else if (data.error) {
                loadingDiv.innerText = "⚠️ خطا: " + (data.error.message || "مشکلی پیش آمد.");
            } else {
                loadingDiv.innerText = "خطا در دریافت پاسخ از هوش مصنوعی!";
            }
        } catch (error) {
            loadingDiv.innerText = "خطا در برقراری ارتباط با سرور!";
        }

        chatBox.scrollTop = chatBox.scrollHeight;
        saveCurrentChat();
    }

    function appendMessage(sender, content) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = content;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function formatReply(text) {
        let formatted = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#171c23; padding:10px; border-radius:8px; overflow-x:auto; margin-top:6px;"><code>$1</code></pre>');
        return formatted.replace(/\n/g, '<br>');
    }

    function startNewChat() {
        currentChatId = Date.now();
        isFirstMessage = true;
        document.getElementById("chatBox").innerHTML = "";
        document.getElementById("chatBox").style.display = 'none';
        document.getElementById("homeScreen").style.display = 'flex';
        renderHistory();
        if (window.innerWidth <= 768) toggleSidebar();
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById("chatBox");
        const firstUserMsg = chatBox.querySelector('.message.user')?.innerText || "گفتگوی جدید";
        chats[currentChatId] = {
            title: firstUserMsg.substring(0, 20) + "...",
            html: chatBox.innerHTML
        };
        localStorage.setItem('visual_chat_history', JSON.stringify(chats));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        Object.keys(chats).reverse().forEach(id => {
            const item = document.createElement("div");
            item.className = `history-item ${id == currentChatId ? 'active' : ''}`;
            item.innerHTML = `<i class="fa-regular fa-message"></i> <span>${chats[id].title}</span>`;
            item.onclick = () => loadChat(id);
            list.appendChild(item);
        });
    }

    function loadChat(id) {
        currentChatId = id;
        isFirstMessage = false;
        document.getElementById("homeScreen").style.display = 'none';
        document.getElementById("chatBox").style.display = 'flex';
        document.getElementById("chatBox").innerHTML = chats[id].html;
        renderHistory();
        if (window.innerWidth <= 768) toggleSidebar();
    }
</script>
</body>
</html>
