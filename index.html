<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Chat Pro</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-main: #0e1217;
            --bg-sidebar: #171c23;
            --bg-card: #1c232d;
            --bg-input: #1e2631;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2e3744;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        select, input, button {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            outline: none !important;
            border: none;
            background: none;
        }

        select::-ms-expand { display: none !important; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none !important;
            margin: 0;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        body { display: flex; position: relative; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 15;
        }
        .sidebar-overlay.active { display: block; }

        .sidebar {
            width: 270px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .user-profile {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .user-info { flex: 1; overflow: hidden; }
        .user-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .new-chat-btn:hover { background-color: var(--border); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }
        .history-item:hover, .history-item.active { background-color: var(--bg-card); color: var(--text-main); }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            position: relative;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .menu-btn {
            display: none;
            color: var(--text-main);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
        }

        .persona-select {
            background: var(--bg-card) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border) !important;
            padding: 6px 30px 6px 12px !important;
            border-radius: 8px !important;
            font-size: 0.85rem !important;
            cursor: pointer !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: left 8px center !important;
            background-size: 14px !important;
            box-shadow: none !important;
        }

        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.3s ease-out;
        }

        .home-title { font-size: 1.8rem; font-weight: 600; color: #e2e8f0; }

        .chat-box {
            flex: 1;
            padding: 20px 15%;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 0.92rem;
            animation: fadeIn 0.25s ease-out forwards;
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background-color: transparent;
            color: var(--text-main);
            padding-right: 0;
        }

        .sticker-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .input-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 15px 15px 15px;
            position: relative;
        }

        .sticker-picker {
            display: none;
            position: absolute;
            bottom: 75px;
            right: 20px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 30;
            animation: fadeIn 0.2s ease;
        }
        .sticker-picker.active { display: grid; }
        .sticker-item {
            width: 50px;
            height: 50px;
            cursor: pointer;
            border-radius: 8px;
            padding: 4px;
            transition: transform 0.2s;
        }
        .sticker-item:hover { transform: scale(1.1); background-color: var(--bg-input); }

        .input-box {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: var(--accent); }

        textarea {
            flex: 1;
            color: white;
            resize: none !important;
            overflow: hidden !important;
            height: 24px;
            max-height: 120px;
            font-size: 0.95rem;
            padding: 2px 0;
            background: transparent !important;
            border: none !important;
            outline: none !important;
        }

        textarea:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .icon-btn {
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .icon-btn:hover:not(:disabled) { color: var(--text-main); background-color: rgba(255,255,255,0.08); }
        .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .icon-btn.search-active {
            color: var(--accent) !important;
            background-color: rgba(56, 189, 248, 0.15) !important;
        }

        .action-btn { color: var(--accent); }
        .action-btn.stop-mode {
            color: var(--danger);
            animation: fadeIn 0.2s ease;
        }

        .file-preview {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            width: fit-content;
        }
        .file-preview img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }

        @media (max-width: 900px) {
            .chat-box { padding: 15px 5%; }
        }

        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .sidebar {
                position: fixed;
                top: 0; right: 0; bottom: 0;
                transform: translateX(100%);
                box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            }
            .sidebar.open { transform: translateX(0); }
            .message { max-width: 90%; }
            .home-title { font-size: 1.4rem; }
            .input-wrapper { padding: 8px 10px 10px 10px; }
            .sticker-picker { right: 10px; left: 10px; grid-template-columns: repeat(4, 1fr); justify-items: center; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="brand-title">
            <span><i class="fa-solid fa-sparkles"></i> Visual Chat</span>
            <i class="fa-solid fa-xmark icon-btn" onclick="toggleSidebar()" style="display: var(--mobile-close, none);"></i>
        </div>

        <div class="user-profile" id="userProfile">
            <div id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="small" data-theme="dark"></div>
        </div>

        <button class="new-chat-btn" id="newChatBtn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> چت جدید
        </button>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="main-content">
        <div class="chat-header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()" title="منو">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <select class="persona-select" id="personaSelect">
                    <option value="default">حالت استاندارد</option>
                    <option value="friendly">صمیمی و دوستانه</option>
                    <option value="coder">برنامه‌نویس و کدنویسی</option>
                    <option value="formal">رسمی</option>
                </select>
            </div>
        </div>

        <div class="home-screen" id="homeScreen">
            <h1 class="home-title">سلام! چطور می‌تونم کمکت کنم؟</h1>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-wrapper">
            <div class="sticker-picker" id="stickerPicker">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f600/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60e/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f917/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f914/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f525/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f389/512.webp" class="sticker-item" onclick="sendSticker(this.src)">
            </div>

            <div class="file-preview" id="filePreview">
                <img id="previewImg" src="" alt="preview">
                <span id="fileName" style="font-size: 0.8rem; color: var(--text-muted);"></span>
                <i class="fa-solid fa-xmark icon-btn" onclick="removeFile()" style="width:24px; height:24px; font-size:0.9rem;"></i>
            </div>

            <div class="input-box">
                <input type="file" id="fileInput" hidden onchange="handleFileSelect(event)">
                <button class="icon-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="افزودن فایل">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <button class="icon-btn" id="stickerBtn" onclick="toggleStickerPicker()" title="استیکر">
                    <i class="fa-regular fa-face-smile"></i>
                </button>

                <button class="icon-btn" id="searchToggleBtn" onclick="toggleSearch()" title="جستجوی وب (گوگل)">
                    <i class="fa-solid fa-globe"></i>
                </button>

                <textarea id="userInput" placeholder="پرسیدن از Visual Bot..." rows="1" onkeydown="handleKeyDown(event)"></textarea>

                <button class="icon-btn action-btn" id="actionBtn" onclick="handleActionClick()" title="ارسال">
                    <i class="fa-solid fa-paper-plane" id="actionIcon"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    let currentChatId = localStorage.getItem('last_active_chat_id') || Date.now();
    let currentUser = null;
    let chats = {};
    let chatHistoryData = {}; // حافظه پیام‌ها برای ارسال به بک‌اند
    let selectedFileData = null;
    let isFirstMessage = true;
    let isGenerating = false;
    let isSearchEnabled = false;
    let currentAbortController = null;
    let typeWriterInterval = null;

    window.onload = () => {
        checkSavedUser();
        renderHistory();

        const storageKey = currentUser ? `visual_chat_${currentUser.email}` : 'visual_chat_history';
        chats = JSON.parse(localStorage.getItem(storageKey)) || {};
        
        const historyKey = currentUser ? `visual_history_${currentUser.email}` : 'visual_history_data';
        chatHistoryData = JSON.parse(localStorage.getItem(historyKey)) || {};

        if (chats[currentChatId]) {
            loadChat(currentChatId);
        }

        if (window.innerWidth <= 768) {
            document.documentElement.style.setProperty('--mobile-close', 'block');
        }
    };

    function toggleSearch() {
        if (isGenerating) return;
        isSearchEnabled = !isSearchEnabled;
        const btn = document.getElementById("searchToggleBtn");
        if (isSearchEnabled) {
            btn.classList.add("search-active");
            btn.title = "جستجوی وب: فعال";
        } else {
            btn.classList.remove("search-active");
            btn.title = "جستجوی وب: غیرفعال";
        }
    }

    function handleCredentialResponse(response) {
        const responsePayload = parseJwt(response.credential);
        currentUser = {
            name: responsePayload.name,
            email: responsePayload.email,
            picture: responsePayload.picture
        };
        localStorage.setItem('visual_chat_user', JSON.stringify(currentUser));
        updateUserUI();
        renderHistory();
    }

    function parseJwt(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    function checkSavedUser() {
        const saved = localStorage.getItem('visual_chat_user');
        if (saved) {
            currentUser = JSON.parse(saved);
            updateUserUI();
        }
    }

    function updateUserUI() {
        if (!currentUser) return;
        const profileDiv = document.getElementById('userProfile');
        profileDiv.innerHTML = `
            <img src="${currentUser.picture}" class="user-avatar" alt="User">
            <div class="user-info">
                <div class="user-name">${currentUser.name}</div>
                <div class="user-email">${currentUser.email}</div>
            </div>
        `;
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function toggleStickerPicker() {
        if (isGenerating) return;
        document.getElementById('stickerPicker').classList.toggle('active');
    }

    function sendSticker(stickerUrl) {
        if (isGenerating) return;
        toggleStickerPicker();
        const stickerHtml = `<img src="${stickerUrl}" class="sticker-img" alt="sticker">`;
        appendMessage('user', stickerHtml);

        if (isFirstMessage) {
            document.getElementById("homeScreen").style.display = 'none';
            document.getElementById("chatBox").style.display = 'flex';
            isFirstMessage = false;
        }

        sendToGemini("کاربر یک استیکر ارسال کرد.");
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!isGenerating) sendMessage();
        }
    }

    function compressImage(file, maxDimension = 1024, quality = 0.7) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxDimension) { height = Math.round((height * maxDimension) / width); width = maxDimension; }
                    } else {
                        if (height > maxDimension) { width = Math.round((width * maxDimension) / height); height = maxDimension; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            };
        });
    }

    async function handleFileSelect(event) {
        if (isGenerating) return;
        const file = event.target.files[0];
        if (!file) return;

        const fileNameSpan = document.getElementById('fileName');
        const previewImg = document.getElementById('previewImg');
        document.getElementById('filePreview').style.display = 'flex';
        fileNameSpan.innerText = "در حال پردازش...";

        try {
            if (file.type.startsWith('image/')) {
                const compressedBase64 = await compressImage(file, 1024, 0.7);
                selectedFileData = { name: file.name, type: 'image/jpeg', base64: compressedBase64 };
                previewImg.src = compressedBase64;
                previewImg.style.display = 'block';
                fileNameSpan.innerText = `${file.name}`;
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedFileData = { name: file.name, type: file.type, base64: e.target.result };
                    previewImg.style.display = 'none';
                    fileNameSpan.innerText = file.name;
                };
                reader.readAsDataURL(file);
            }
        } catch (e) { fileNameSpan.innerText = "خطا در آپلود"; }
    }

    function removeFile() {
        selectedFileData = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('filePreview').style.display = 'none';
    }

    function handleActionClick() {
        if (isGenerating) {
            stopGeneration();
        } else {
            sendMessage();
        }
    }

    function setGeneratingState(generating) {
        isGenerating = generating;
        const inputField = document.getElementById("userInput");
        const actionBtn = document.getElementById("actionBtn");
        const actionIcon = document.getElementById("actionIcon");
        const attachBtn = document.getElementById("attachBtn");
        const stickerBtn = document.getElementById("stickerBtn");
        const searchBtn = document.getElementById("searchToggleBtn");

        inputField.disabled = generating;
        attachBtn.disabled = generating;
        stickerBtn.disabled = generating;
        searchBtn.disabled = generating;

        if (generating) {
            actionBtn.classList.add("stop-mode");
            actionIcon.className = "fa-solid fa-square";
            actionBtn.title = "توقف پاسخ";
        } else {
            actionBtn.classList.remove("stop-mode");
            actionIcon.className = "fa-solid fa-paper-plane";
            actionBtn.title = "ارسال";
        }
    }

    function stopGeneration() {
        if (currentAbortController) {
            currentAbortController.abort();
        }
        if (typeWriterInterval) {
            clearInterval(typeWriterInterval);
        }
        setGeneratingState(false);
        saveCurrentChat();
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const text = inputField.value.trim();
        if (!text && !selectedFileData) return;

        if (isFirstMessage) {
            document.getElementById("homeScreen").style.display = 'none';
            document.getElementById("chatBox").style.display = 'flex';
            isFirstMessage = false;
        }

        let userContentHtml = text;
        if (selectedFileData && selectedFileData.type.startsWith('image/')) {
            userContentHtml += `<br><img src="${selectedFileData.base64}" style="max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px;">`;
        }

        appendMessage('user', userContentHtml);
        inputField.value = "";

        const payloadFile = selectedFileData;
        removeFile();

        sendToGemini(text, payloadFile);
    }

    async function sendToGemini(textPrompt, payloadFile = null) {
        setGeneratingState(true);
        const chatBox = document.getElementById("chatBox");
        const persona = document.getElementById("personaSelect").value;

        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = isSearchEnabled ? "در حال جستجو در وب و پاسخ..." : "در حال پاسخ...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        // محاسبه دقیق زمان و تاریخ ایران جهت برطرف شدن مشکل زمان
        const now = new Date();
        const timeString = now.toLocaleTimeString('fa-IR', { timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit' });
        const dateString = now.toLocaleDateString('fa-IR-u-nu-latn', { timeZone: 'Asia/Tehran', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const contextInfo = `[زمان دقیق ایران: امروز ${dateString} | ساعت: ${timeString}]`;

        const systemInstruction = "دستورالعمل مهم: نام تو Visual Bot است. اگر هر کسی درباره هویت، نام، مدل یا سازنده تو پرسید، تحت هیچ شرایطی نباید نام Gemini یا Google را ببری و باید بگویی نام من Visual Bot است. همچنین در استفاده از ایموجی زیاده‌روی نکن و حداکثر ۱ تا ۲ ایموجی ملایم در کل متن استفاده کن.";
        const fullPrompt = systemInstruction + "\n" + contextInfo + "\n\nمتن کاربر: " + (textPrompt || '');

        // بروزرسانی حافظه چت بر اساس شاسی این گفتگو
        if (!chatHistoryData[currentChatId]) {
            chatHistoryData[currentChatId] = [];
        }
        chatHistoryData[currentChatId].push({ role: 'user', text: fullPrompt });

        currentAbortController = new AbortController();

        try {
            const response = await fetch('/api/chat', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    text: fullPrompt, 
                    persona: persona, 
                    file: payloadFile,
                    webSearch: isSearchEnabled,
                    history: chatHistoryData[currentChatId] // ارسال کل تاریخچه چت برای حافظه‌دار شدن
                }),
                signal: currentAbortController.signal
            });

            const data = await response.json();

            if (response.status === 429) {
                loadingDiv.innerHTML = "⏳ **محدودیت درخواست!** لطفاً چند لحظه صبر کنید.";
                setGeneratingState(false);
                saveCurrentChat();
            } else if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                const reply = data.candidates[0].content.parts[0].text;
                
                // افزودن پاسخ مدل به حافظه چت
                chatHistoryData[currentChatId].push({ role: 'model', text: reply });

                typeWriterEffect(loadingDiv, reply, () => {
                    setGeneratingState(false);
                    saveCurrentChat();
                });
            } else {
                loadingDiv.innerText = "⚠️ خطا در دریافت پاسخ!";
                setGeneratingState(false);
                saveCurrentChat();
            }
        } catch (error) {
            if (error.name === 'AbortError') {
                loadingDiv.innerHTML += " <span style='color:var(--text-muted); font-size:0.8rem;'>(توسط کاربر متوقف شد)</span>";
            } else {
                loadingDiv.innerText = "خطا در ارتباط با سرور!";
            }
            setGeneratingState(false);
            saveCurrentChat();
        }
    }

    function typeWriterEffect(element, text, onComplete) {
        element.innerHTML = "";
        let i = 0;
        const formatted = formatReply(text);

        typeWriterInterval = setInterval(() => {
            if (i < formatted.length) {
                element.innerHTML = formatted.substring(0, i + 1);
                i++;
                const chatBox = document.getElementById("chatBox");
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                clearInterval(typeWriterInterval);
                if (onComplete) onComplete();
            }
        }, 12);
    }

    function appendMessage(sender, content) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = content;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function formatReply(text) {
        let formatted = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#171c23; padding:10px; border-radius:8px; overflow-x:auto; margin-top:6px;"><code>$1</code></pre>');
        return formatted.replace(/\n/g, '<br>');
    }

    function startNewChat() {
        if (isGenerating) stopGeneration();
        currentChatId = Date.now();
        localStorage.setItem('last_active_chat_id', currentChatId);
        isFirstMessage = true;
        document.getElementById("chatBox").innerHTML = "";
        document.getElementById("chatBox").style.display = 'none';
        document.getElementById("homeScreen").style.display = 'flex';
        renderHistory();
        if (window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById("chatBox");
        const firstUserMsg = chatBox.querySelector('.message.user')?.innerText || "گفتگوی جدید";

        const storageKey = currentUser ? `visual_chat_${currentUser.email}` : 'visual_chat_history';
        const historyKey = currentUser ? `visual_history_${currentUser.email}` : 'visual_history_data';

        chats[currentChatId] = {
            title: firstUserMsg.substring(0, 20) + "...",
            html: chatBox.innerHTML
        };
        localStorage.setItem(storageKey, JSON.stringify(chats));
        localStorage.setItem(historyKey, JSON.stringify(chatHistoryData));
        localStorage.setItem('last_active_chat_id', currentChatId);
        renderHistory();
    }

    function renderHistory() {
        const storageKey = currentUser ? `visual_chat_${currentUser.email}` : 'visual_chat_history';
        chats = JSON.parse(localStorage.getItem(storageKey)) || {};

        const list = document.getElementById("historyList");
        list.innerHTML = "";
        Object.keys(chats).reverse().forEach(id => {
            const item = document.createElement("div");
            item.className = `history-item ${id == currentChatId ? 'active' : ''}`;
            item.innerHTML = `<i class="fa-regular fa-message"></i> <span>${chats[id].title}</span>`;
            item.onclick = () => {
                if (!isGenerating) loadChat(id);
            };
            list.appendChild(item);
        });
    }

    function loadChat(id) {
        if (isGenerating) stopGeneration();
        currentChatId = id;
        localStorage.setItem('last_active_chat_id', currentChatId);
        isFirstMessage = false;
        document.getElementById("homeScreen").style.display = 'none';
        document.getElementById("chatBox").style.display = 'flex';
        document.getElementById("chatBox").innerHTML = chats[id].html;
        renderHistory();
        if (window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('open')) {
            toggleSidebar();
        }
    }
</script>
</body>
</html>
