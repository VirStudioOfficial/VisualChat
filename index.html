<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Chat AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* حاوی کل چت‌باکس */
        .chat-card {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: #1e293b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        /* هدر */
        .chat-header {
            padding: 16px 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        /* پیام‌ها */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            animation: popIn 0.25s ease-out forwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-start;
            background-color: #0284c7;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background-color: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid #475569;
        }

        /* انیمیشن سه‌نقطه در حال تایپ */
        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            margin: 0 2px;
            animation: dotPulse 1.2s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.2); opacity: 1; }
        }

        /* فوتر و دکمه ارسال */
        .chat-footer {
            padding: 16px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .chat-input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #38bdf8;
        }

        /* حذف هرگونه فلش، اسپینر یا آیکون مرورگر زشت */
        select, 
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            margin: 0;
        }

        .send-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #0369a1;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="chat-header">
            <div class="chat-title">
                <span>🤖</span> Visual Chat AI
            </div>
            <button class="clear-btn" onclick="clearHistory()">پاک‌کردن چت</button>
        </div>

        <div class="chat-messages" id="messages-container">
            <!-- پیام‌ها اینجا قرار می‌گیرند -->
        </div>

        <div class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="user-input" class="chat-input" placeholder="پیامت رو بنویس..." onkeydown="handleKeyPress(event)">
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'visual_chat_history_v2';
        const messagesContainer = document.getElementById('messages-container');
        const userInput = document.getElementById('user-input');

        // بارگذاری سابقه چت هنگام ورود
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
        });

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // نمایش پیام کاربر
            appendMessage(text, 'user');
            saveToStorage(text, 'user');
            userInput.value = '';

            // نشانگر در حال تایپ
            const loadingElem = appendLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text + " (در پاسخ حتماً از ایموجی‌های جذاب، خفن و استیکرهای متنی استفاده کن ✨🔥)",
                        persona: 'friendly'
                    })
                });

                const data = await response.json();
                messagesContainer.removeChild(loadingElem);

                const botReply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "مشکلی پیش آمد! 😅";

                // ایجاد عنصر پیام بات و افکت تایپ
                const botMsgElem = appendMessage('', 'bot');
                typeText(botMsgElem, botReply, () => {
                    saveToStorage(botReply, 'bot');
                });

            } catch (err) {
                messagesContainer.removeChild(loadingElem);
                appendMessage("ارتباط برقرار نشد! ❌", 'bot');
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function appendLoading() {
            const loadDiv = document.createElement('div');
            loadDiv.className = 'message bot';
            loadDiv.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
            messagesContainer.appendChild(loadDiv);
            scrollToBottom();
            return loadDiv;
        }

        // انیمیشن تایپ واقعی کلمه به کلمه
        function typeText(element, text, onComplete) {
            let i = 0;
            const speed = 15; // سرعت تایپ
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    scrollToBottom();
                    setTimeout(type, speed);
                } else if (onComplete) {
                    onComplete();
                }
            }
            type();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function saveToStorage(text, sender) {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            history.push({ text, sender });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (history.length === 0) {
                appendMessage("سلام داداش! چطور می‌تونم کمکت کنم؟ 🔥🤖", 'bot');
            } else {
                history.forEach(item => appendMessage(item.text, item.sender));
            }
        }

        function clearHistory() {
            localStorage.removeItem(STORAGE_KEY);
            messagesContainer.innerHTML = '';
            appendMessage("چت پاک شد! پیام جدید بفرست 😉✨", 'bot');
        }
    </script>
</body>
</html>
