<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Chat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #40e0d0; /* turquoise blue */
            --accent-hover: #36c3b5;
            --user-msg-bg: #0f766e;
            --bot-msg-bg: #334155;
            --input-bg: #0f172a;
            --border-color: #334155;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --user-msg-bg: #0d9488;
            --bot-msg-bg: #e2e8f0;
            --input-bg: #f8fafc;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar Header & Layout */
        #sidebar {
            width: 280px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 1rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 75%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--user-msg-bg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-end;
            background-color: var(--bot-msg-bg);
            border-bottom-left-radius: 2px;
        }

        /* Controls & Inputs */
        .input-area {
            padding: 1rem;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-wrapper {
            display: flex;
            gap: 0.5rem;
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            resize: none;
            height: 50px;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-item {
            padding: 0.6rem;
            background-color: var(--input-bg);
            border-radius: 6px;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h3>Virtual Chat</h3>
        <button id="btn-new-chat">+ چت جدید</button>
        <div class="history-list" id="history-list"></div>
        <hr style="border-color: var(--border-color);">
        <button id="btn-auth" class="secondary">ورود با گوگل</button>
        <button id="btn-theme" class="secondary">تغییر تم</button>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-container">
        <div class="chat-header">
            <span id="user-display-name">کاربر مهمان</span>
            <div class="toggle-switch">
                <input type="checkbox" id="web-search-toggle">
                <label for="web-search-toggle">جستجوی وب</label>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">سلام! چطور می‌توانم کمکتان کنم؟</div>
        </div>

        <div class="input-area">
            <div class="controls-bar">
                <button id="btn-voice" class="secondary">🎤 صوت</button>
                <button id="btn-attach" class="secondary">📁 تصویر/استیکر</button>
                <button id="btn-stop" class="secondary" style="display: none; color: #ef4444;">توقف پاسخ</button>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
            </div>
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="پیام خود را بنویسید..."></textarea>
                <button id="btn-send">ارسال</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let isGenerating = false;
        let speechRecognition = null;

        // DOM Elements
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const btnStop = document.getElementById('btn-stop');
        const btnTheme = document.getElementById('btn-theme');
        const btnVoice = document.getElementById('btn-voice');
        const btnAttach = document.getElementById('btn-attach');
        const fileInput = document.getElementById('file-input');
        const btnAuth = document.getElementById('btn-auth');
        const userNameDisplay = document.getElementById('user-display-name');

        // Toggle Theme
        btnTheme.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
        });

        // Add Message to DOM
        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        // Typewriter Effect & TTS
        function streamBotResponse(fullText) {
            isGenerating = true;
            btnStop.style.display = 'inline-block';
            
            const botMsgDiv = appendMessage('', 'bot');
            let index = 0;

            const interval = setInterval(() => {
                if (!isGenerating) {
                    clearInterval(interval);
                    btnStop.style.display = 'none';
                    return;
                }

                if (index < fullText.length) {
                    botMsgDiv.textContent += fullText.charAt(index);
                    index++;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    clearInterval(interval);
                    isGenerating = false;
                    btnStop.style.display = 'none';
                    speakText(fullText);
                }
            }, 30);
        }

        // Text To Speech (Persian Support)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech To Text
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SpeechRecognition();
            speechRecognition.lang = 'fa-IR';

            speechRecognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
            };

            btnVoice.addEventListener('click', () => {
                speechRecognition.start();
            });
        } else {
            btnVoice.style.display = 'none';
        }

        // Handle Send
        function handleSend() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            appendMessage(text, 'user');
            userInput.value = '';

            // Simulated response with Typewriter
            setTimeout(() => {
                streamBotResponse("این یک پاسخ نمونه برای آزمایش قابلیت‌های چت است.");
            }, 500);
        }

        btnSend.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // Handle Stop Generation
        btnStop.addEventListener('click', () => {
            isGenerating = false;
            btnStop.style.display = 'none';
        });

        // Image Attachment
        btnAttach.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                appendMessage(`[تصویر ارسال شد: ${file.name}]`, 'user');
            }
        });

        // Google Auth Placeholder
        btnAuth.addEventListener('click', () => {
            const name = prompt("لطفاً نام خود را وارد کنید:", "کاربر جدید");
            if (name) {
                userNameDisplay.textContent = name;
                btnAuth.textContent = "خروج";
            }
        });
    </script>
</body>
</html>
