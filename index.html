<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Chat</title>
    <style>
        /* استایل حذف فلش‌های اضافه (Select/Input Spinners) */
        select, input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* انیمیشن ظاهر شدن پیام‌ها */
        .message {
            animation: fadeIn 0.3s ease-in-out forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* انیمیشن سه‌نقطه موقع در حال تایپ بودن */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #3b82f6;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- بخش چت باکس و کدهای مرتبط -->

    <script>
        const CHAT_STORAGE_KEY = 'chat_history_v1';

        // ۱. بارگذاری چت‌های قبلی موقع رفرش
        document.addEventListener('DOMContentLoaded', () => {
            loadChatHistory();
        });

        function saveChatHistory(messages) {
            localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(messages));
        }

        function loadChatHistory() {
            const saved = localStorage.getItem(CHAT_STORAGE_KEY);
            if (saved) {
                const messages = JSON.parse(saved);
                messages.forEach(msg => renderMessage(msg.text, msg.sender, false));
            }
        }

        // ۲. انیمیشن تایپ پیام برای پاسخ بات
        function typeWriterEffect(element, text, speed = 15) {
            let i = 0;
            element.textContent = '';
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // ۳. ارسال پیام و پرامپت ایموجی
        async function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            renderMessage(userText, 'user');
            inputField.value = '';

            // نشانگر تایپ بات
            const botMessageElem = renderMessage('...', 'bot', true);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        // دستور به الگوریتم برای استفاده منظم از ایموجی و استیکر متنی
                        text: userText + " (لطفاً در پاسخ خود به صورت صمیمی از ایموجی‌ها و استیکرهای متنی مناسب استفاده کن 😊✨)",
                        persona: 'friendly'
                    })
                });

                const data = await response.json();
                const botReply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "مشکلی پیش آمد! 😅";

                // افکت انیمیشن افکت تایپ
                typeWriterEffect(botMessageElem, botReply);

                // ذخیره در LocalStorage
                saveToStorage(userText, botReply);

            } catch (err) {
                botMessageElem.textContent = "خطا در برقراری ارتباط! ❌";
            }
        }

        function renderMessage(text, sender, isTyping = false) {
            const chatContainer = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message`;
            
            if (isTyping) {
                msgDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            } else {
                msgDiv.textContent = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function saveToStorage(userText, botText) {
            const history = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '[]');
            history.push({ sender: 'user', text: userText });
            history.push({ sender: 'bot', text: botText });
            localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(history));
        }
    </script>
</body>
</html>
