<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Chat AI</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #00f2fe;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* صفحه لاگین اجباری (Modal Overlay) */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #auth-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: modalUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .auth-card i.brand-icon {
            font-size: 48px;
            color: var(--accent-color);
            margin-bottom: 16px;
        }

        .auth-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        /* رابط کاربری چت */
        .header {
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
        }

        .chat-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-box {
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.5);
            color: #fff;
            outline: none;
        }

        .settings-panel {
            padding: 12px 24px;
            background: rgba(30, 41, 59, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .settings-panel input {
            width: 180px;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

    <!-- مودال لاگین اجباری -->
    <div id="auth-overlay">
        <div class="auth-card">
            <i class="fa-solid fa-robot brand-icon"></i>
            <h2>ورود به Visual Chat</h2>
            <p>برای استفاده از امکانات چت‌بات و ذخیره تنظیمات، لطفا با حساب گوگل خود وارد شوید.</p>
            
            <div id="g_id_onload"
                data-client_id="820812673874-35oc9gs6vf2hm43gv8k4a64t9gsf2alu.apps.googleusercontent.com"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>

            <div class="google-btn-container">
                <div class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="filled_black"
                    data-text="sign_in_with"
                    data-shape="pill"
                    data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>

    <!-- هدر سایت -->
    <div class="header">
        <h3>Visual Chat AI</h3>
        <div class="user-profile" id="user-info" style="display: none;">
            <span id="user-display-name">کاربر</span>
            <img id="user-avatar-img" class="user-avatar" src="" alt="Avatar">
        </div>
    </div>

    <!-- پنل تنظیمات اسم کاربر -->
    <div class="settings-panel">
        <label for="custom-name-input">نام شما در چت:</label>
        <input type="text" id="custom-name-input" placeholder="مثلا: ارشیا" onchange="updateUserName(this.value)">
    </div>

    <!-- باکس چت -->
    <div class="chat-container" id="chat-box">
        <!-- پیام‌ها اینجا رندر می‌شوند -->
    </div>

    <!-- ورودی پیام -->
    <div class="input-box">
        <input type="text" id="user-input" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()" style="padding: 0 20px; border-radius: 12px; background: var(--accent-color); border: none; cursor: pointer; font-weight: bold;">ارسال</button>
    </div>

    <script>
        let currentUser = {
            email: '',
            name: '',
            picture: ''
        };

        // رمزگشایی توکن گوگل JWT
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // استخراج نام هوشمند از روی ایمیل
        function extractNameFromEmail(email) {
            if (!email) return 'دوست من';
            const handle = email.split('@')[0].toLowerCase();
            
            // جدول نگاشت پیش‌فرض برای نام‌های متداول
            const nameMap = {
                'arshia': 'ارشیا',
                'ali': 'علی',
                'رضا': 'reza',
                'مکان': 'mahan',
                'amir': 'امیر',
                'mohammad': 'محمد',
                'sara': 'سارا',
                'mehdi': 'مهدی'
            };

            for (let key in nameMap) {
                if (handle.startsWith(key)) {
                    return nameMap[key];
                }
            }

            // اگر اسم خاصی پیدا نشد، حروف اول رو مرتب می‌کنه
            const cleanName = handle.replace(/[0-9_.-]/g, '');
            return cleanName ? (cleanName.charAt(0).toUpperCase() + cleanName.slice(1)) : 'دوست من';
        }

        // کال‌بک پس از ورود موفق با گوگل
        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            if (!data) return;

            currentUser.email = data.email || '';
            currentUser.picture = data.picture || '';

            // بررسی اسم از localStorage یا استخراج از ایمیل
            const savedName = localStorage.getItem('chat_user_name');
            if (savedName) {
                currentUser.name = savedName;
            } else {
                currentUser.name = extractNameFromEmail(currentUser.email);
            }

            // بروزرسانی UI
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('user-info').style.display = 'flex';
            document.getElementById('user-avatar-img').src = currentUser.picture;
            document.getElementById('user-display-name').textContent = currentUser.name;
            document.getElementById('custom-name-input').value = currentUser.name;

            console.log("کاربر با موفقیت وارد شد:", currentUser);
        }

        // تغییر نام دستی از بخش تنظیمات
        function updateUserName(newName) {
            if (!newName.trim()) return;
            currentUser.name = newName.trim();
            localStorage.setItem('chat_user_name', currentUser.name);
            document.getElementById('user-display-name').textContent = currentUser.name;
        }

        // ارسال پیام و تزریق نام کاربر به سیستم
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const rawText = input.value.trim();
            if (!rawText) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div><b>شما:</b> ${rawText}</div>`;
            input.value = '';

            // ساخت پرامپت با در نظر گرفتن اسم کاربر
            const systemInstruction = `نام کاربر ${currentUser.name} است. در پاسخ‌ها صمیمی باش و در صورت لزوم او را با نام ${currentUser.name} خطاب کن.`;
            const fullPrompt = `${systemInstruction}\n\nپیام کاربر: ${rawText}`;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: fullPrompt,
                        rawText: rawText,
                        webSearch: true
                    })
                });

                const data = await res.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "خطا در دریافت پاسخ.";
                chatBox.innerHTML += `<div><b>ربات:</b> ${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div><b>خطا:</b> عدم ارتباط با سرور</div>`;
            }
        }
    </script>
</body>
</html>
